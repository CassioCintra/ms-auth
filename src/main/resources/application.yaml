#file: noinspection YAMLSchemaValidation,SpellCheckingInspection
spring:
  application:
    name: ms-auth
  docker:
    compose:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ms_auth}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    schemas: public

auth:
  issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
  bootstrap:
    admin:
      username: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
    machine-clients:
      order-service:
        secret: ${ORDER_SERVICE_CLIENT_SECRET:order-service-secret}
        scopes: flags:read
      ms-workspace-management:
        secret: ${MS_WORKSPACE_MANAGEMENT_CLIENT_SECRET:ms-workspace-management-secret}
        scopes: users:admin
      ms-dashboard:
        secret: ${MS_DASHBOARD_CLIENT_SECRET:ms-dashboard-secret}
        scopes: flags:read,audit:read
      ms-feature-flags-management:
        secret: ${MS_FEATURE_FLAGS_MANAGEMENT_CLIENT_SECRET:ms-feature-flags-management-secret}
        scopes: flags:write
    pkce-clients:
      dashboard-frontend:
        redirect-uri: ${DASHBOARD_FRONTEND_REDIRECT_URI:http://app.switchboard.io/callback}
      swagger-ui:
        redirect-uri: ${SWAGGER_UI_REDIRECT_URI:http://localhost:8090/swagger-ui/oauth2-redirect.html}
  # Escopo -> recurso que aceita o token (claim aud). Colchetes preservam o ":" na chave.
  audiences:
    "[flags:read]": consul
    "[flags:write]": consul

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlator}] %-5level %logger{0} - %msg%n"
  level:
    io.github.cassio: DEBUG

info:
  app:
    version: "@project.version@"

server:
  port: 9000
  servlet:
    context-path: /
