#file: noinspection YAMLSchemaValidation,SpellCheckingInspection
spring:
  application:
    name: ms-auth
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/ms_auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    schemas: public

auth:
  issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
  admin:
    secret: ${AUTH_ADMIN_SECRET:change-me-dev-only}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlator}] %-5level %logger{36} - %msg%n"
  level:
    io.github.cassio: DEBUG

server:
  port: 9000
  servlet:
    context-path: /
